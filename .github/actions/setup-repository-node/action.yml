name: Set up the repository Node toolchain
description: Install the exact Node.js and npm versions required by repository gates

runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version-file: .node-version
        cache: npm
        cache-dependency-path: docs/architecture-site/package-lock.json

    - name: Select the repository-pinned npm version
      shell: bash
      run: npm install --global "$(node -p "require('./docs/architecture-site/package.json').packageManager")"
