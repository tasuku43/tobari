name: Auth Broker image

on:
  pull_request:
    paths:
      - authbroker/**
      - internal/infra/runtimeassets/assets/authbroker/**
      - internal/infra/runtimeassets/assets/versions.env
      - scripts/check-authbroker-source.sh
      - scripts/sync-authbroker-source.sh
      - scripts/check-authbroker-image.sh
      - .github/workflows/authbroker-image.yml
  workflow_dispatch:
    inputs:
      revision:
        description: "Full reviewed source commit"
        required: true
        type: string
      publish:
        description: "Publish the immutable component image after protected-environment approval"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: auth-broker-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and verify Auth Broker image
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.publish == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false

      - name: Validate manually requested revision
        if: github.event_name == 'workflow_dispatch'
        env:
          COMPONENT_REVISION: ${{ inputs.revision }}
        shell: bash
        run: |
          [[ "$COMPONENT_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$COMPONENT_REVISION"

      - name: Verify canonical source, snapshot, and image contract
        run: |
          ./scripts/check-authbroker-source.sh
          ./scripts/check-authbroker-image.sh

      - name: Run Auth Broker unit tests in the pinned Python base
        shell: bash
        run: |
          set -euo pipefail
          mitmproxy_image=$(awk -F= '$1 == "MITMPROXY_IMAGE" { print $2 }' internal/infra/runtimeassets/assets/versions.env)
          test -n "$mitmproxy_image"
          [[ "$mitmproxy_image" == *@sha256:* ]]
          docker run --rm --read-only --network none \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --volume "$PWD:/workspace:ro" --workdir /workspace \
            "$mitmproxy_image" \
            python3 -m unittest discover -s authbroker/tests -v

      - name: Build multi-architecture Auth Broker image without pushing
        shell: bash
        run: |
          set -euo pipefail
          mitmproxy_image=$(awk -F= '$1 == "MITMPROXY_IMAGE" { print $2 }' internal/infra/runtimeassets/assets/versions.env)
          debian_image=$(awk -F= '$1 == "DEBIAN_IMAGE" { print $2 }' internal/infra/runtimeassets/assets/versions.env)
          test -n "$mitmproxy_image" && test -n "$debian_image"
          [[ "$mitmproxy_image" == *@sha256:* ]] && [[ "$debian_image" == *@sha256:* ]]
          revision=$(git rev-parse HEAD)
          builder="tobari-auth-broker-${GITHUB_RUN_ID}"
          docker buildx create --name "$builder" --driver docker-container --use
          trap 'docker buildx rm "$builder" >/dev/null 2>&1 || true' EXIT
          docker buildx inspect --bootstrap
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file authbroker/Dockerfile \
            --build-arg "MITMPROXY_IMAGE=$mitmproxy_image" \
            --build-arg "DEBIAN_IMAGE=$debian_image" \
            --label "org.opencontainers.image.revision=$revision" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --output type=cacheonly \
            authbroker

  publish:
    name: Publish Auth Broker image
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    runs-on: ubuntu-latest
    environment: release-publication
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false

      - name: Validate requested revision
        env:
          COMPONENT_REVISION: ${{ inputs.revision }}
        shell: bash
        run: |
          [[ "$COMPONENT_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$COMPONENT_REVISION"

      - name: Verify canonical source, snapshot, image contract, and tests
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/check-authbroker-source.sh
          ./scripts/check-authbroker-image.sh
          mitmproxy_image=$(awk -F= '$1 == "MITMPROXY_IMAGE" { print $2 }' internal/infra/runtimeassets/assets/versions.env)
          test -n "$mitmproxy_image"
          [[ "$mitmproxy_image" == *@sha256:* ]]
          docker run --rm --read-only --network none \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --volume "$PWD:/workspace:ro" --workdir /workspace \
            "$mitmproxy_image" \
            python3 -m unittest discover -s authbroker/tests -v

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and push multi-architecture Auth Broker image
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${IMAGE_OWNER,,}/tobari/auth-broker"
          revision=$(git rev-parse HEAD)
          mitmproxy_image=$(awk -F= '$1 == "MITMPROXY_IMAGE" { print $2 }' internal/infra/runtimeassets/assets/versions.env)
          debian_image=$(awk -F= '$1 == "DEBIAN_IMAGE" { print $2 }' internal/infra/runtimeassets/assets/versions.env)
          test -n "$mitmproxy_image" && test -n "$debian_image"
          [[ "$mitmproxy_image" == *@sha256:* ]] && [[ "$debian_image" == *@sha256:* ]]
          builder="tobari-auth-broker-${GITHUB_RUN_ID}"
          docker buildx create --name "$builder" --driver docker-container --use
          trap 'docker buildx rm "$builder" >/dev/null 2>&1 || true' EXIT
          docker buildx inspect --bootstrap
          if docker buildx imagetools inspect "$image:sha-$revision" >/dev/null 2>&1; then
            echo "immutable Auth Broker tag already exists; refusing to overwrite it" >&2
            exit 1
          fi
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file authbroker/Dockerfile \
            --build-arg "MITMPROXY_IMAGE=$mitmproxy_image" \
            --build-arg "DEBIAN_IMAGE=$debian_image" \
            --label "org.opencontainers.image.revision=$revision" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=main-${revision:0:12}" \
            --sbom=true \
            --provenance=mode=max \
            --tag "$image:latest" \
            --tag "$image:main" \
            --tag "$image:sha-$revision" \
            --push \
            authbroker
          inspect_json=$(docker buildx imagetools inspect "$image:sha-$revision" --format '{{json .}}')
          index_digest=$(printf '%s' "$inspect_json" | jq -er '.manifest.digest')
          media_type=$(printf '%s' "$inspect_json" | jq -er '.manifest.mediaType')
          platforms=$(printf '%s' "$inspect_json" | jq -r '
            [.manifest.manifests[]
              | select(.platform.os == "linux" and (.platform.architecture == "amd64" or .platform.architecture == "arm64"))
              | .platform.os + "/" + .platform.architecture]
            | unique | sort | join(",")
          ')
          test "$media_type" = "application/vnd.oci.image.index.v1+json"
          test "$platforms" = "linux/amd64,linux/arm64"
          for tag in latest main; do
            tag_digest=$(docker buildx imagetools inspect "$image:$tag" --format '{{json .}}' | jq -er '.manifest.digest')
            test "$tag_digest" = "$index_digest"
          done
          docker buildx imagetools inspect "$image@$index_digest" --format '{{ json .SBOM }}' > auth-broker.sbom.spdx.json
          docker buildx imagetools inspect "$image@$index_digest" --format '{{ json .Provenance }}' > auth-broker.provenance.slsa.json
          jq -e 'type == "object" and length > 0' auth-broker.sbom.spdx.json >/dev/null
          jq -e 'type == "object" and length > 0' auth-broker.provenance.slsa.json >/dev/null
          jq -n --arg image "$image" --arg digest "$index_digest" --arg revision "$revision" \
            '{schema_version:1,image:$image,digest:$digest,revision:$revision,platforms:["linux/amd64","linux/arm64"],sbom:"auth-broker.sbom.spdx.json",provenance:"auth-broker.provenance.slsa.json"}' \
            > auth-broker.component.json
          {
            echo "### Auth Broker image"
            echo
            echo "- source revision: $revision"
            echo "- manifest digest: $index_digest"
            echo "- platforms: $platforms"
            echo "- immutable reference: $image@$index_digest"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified Auth Broker component evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: auth-broker-component-${{ inputs.revision }}
          path: |
            auth-broker.component.json
            auth-broker.sbom.spdx.json
            auth-broker.provenance.slsa.json
          if-no-files-found: error
