name: Gateway image

on:
  pull_request:
    paths:
      - gateway/**
      - internal/infra/runtimeassets/assets/gateway/**
      - internal/infra/runtimeassets/assets/versions.env
      - scripts/check-gateway-source.sh
      - scripts/sync-gateway-source.sh
      - .github/workflows/gateway-image.yml
  push:
    branches: [main]
    paths:
      - gateway/**
      - internal/infra/runtimeassets/assets/gateway/**
      - internal/infra/runtimeassets/assets/versions.env
      - scripts/check-gateway-source.sh
      - scripts/sync-gateway-source.sh
      - .github/workflows/gateway-image.yml

permissions:
  contents: read

concurrency:
  group: gateway-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and verify Gateway image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify canonical source and embedded snapshot
        run: ./scripts/check-gateway-source.sh

      - name: Run Gateway unit tests
        run: ./scripts/check.sh gateway

      - name: Build multi-architecture Gateway image without pushing
        shell: bash
        run: |
          set -euo pipefail
          mitmproxy_image=$(awk -F= '$1 == "MITMPROXY_IMAGE" { print $2 }' internal/infra/runtimeassets/assets/versions.env)
          test -n "$mitmproxy_image"
          [[ "$mitmproxy_image" == *@sha256:* ]]
          builder="tobari-gateway-${GITHUB_RUN_ID}"
          docker buildx create --name "$builder" --driver docker-container --use
          trap 'docker buildx rm "$builder" >/dev/null 2>&1 || true' EXIT
          docker buildx inspect --bootstrap
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file gateway/Dockerfile \
            --build-arg "MITMPROXY_IMAGE=$mitmproxy_image" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --output type=cacheonly \
            gateway

  publish:
    name: Publish Gateway image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify canonical source and embedded snapshot
        run: ./scripts/check-gateway-source.sh

      - name: Run Gateway unit tests
        run: ./scripts/check.sh gateway

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and push multi-architecture Gateway image
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${IMAGE_OWNER,,}/tobari/gateway"
          mitmproxy_image=$(awk -F= '$1 == "MITMPROXY_IMAGE" { print $2 }' internal/infra/runtimeassets/assets/versions.env)
          test -n "$mitmproxy_image"
          [[ "$mitmproxy_image" == *@sha256:* ]]
          builder="tobari-gateway-${GITHUB_RUN_ID}"
          docker buildx create --name "$builder" --driver docker-container --use
          trap 'docker buildx rm "$builder" >/dev/null 2>&1 || true' EXIT
          docker buildx inspect --bootstrap
          if docker buildx imagetools inspect "$image:sha-$GITHUB_SHA" >/dev/null 2>&1; then
            echo "immutable Gateway tag already exists; refusing to overwrite it" >&2
            exit 1
          fi
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file gateway/Dockerfile \
            --build-arg "MITMPROXY_IMAGE=$mitmproxy_image" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=main-${GITHUB_SHA:0:12}" \
            --tag "$image:latest" \
            --tag "$image:main" \
            --tag "$image:sha-$GITHUB_SHA" \
            --push \
            gateway
          inspect_json=$(docker buildx imagetools inspect "$image:sha-$GITHUB_SHA" --format '{{json .}}')
          index_digest=$(printf '%s' "$inspect_json" | jq -er '.manifest.digest')
          media_type=$(printf '%s' "$inspect_json" | jq -er '.manifest.mediaType')
          platforms=$(printf '%s' "$inspect_json" | jq -r '
            [.manifest.manifests[]
              | select(.platform.os == "linux" and (.platform.architecture == "amd64" or .platform.architecture == "arm64"))
              | .platform.os + "/" + .platform.architecture]
            | unique | sort | join(",")
          ')
          test "$media_type" = "application/vnd.oci.image.index.v1+json"
          test "$platforms" = "linux/amd64,linux/arm64"
          for tag in latest main; do
            tag_digest=$(docker buildx imagetools inspect "$image:$tag" --format '{{json .}}' | jq -er '.manifest.digest')
            test "$tag_digest" = "$index_digest"
          done
          {
            echo "### Gateway image"
            echo
            echo "- source revision: $GITHUB_SHA"
            echo "- manifest digest: $index_digest"
            echo "- platforms: $platforms"
            echo "- immutable reference: $image@$index_digest"
          } >> "$GITHUB_STEP_SUMMARY"
