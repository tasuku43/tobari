name: Gateway image

on:
  pull_request:
    paths:
      - gateway/**
      - internal/infra/runtimeassets/assets/gateway/**
      - internal/infra/runtimeassets/assets/versions.env
      - scripts/check-gateway-source.sh
      - scripts/sync-gateway-source.sh
      - .github/workflows/gateway-image.yml
  workflow_dispatch:
    inputs:
      revision:
        description: "Full reviewed source commit"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gateway-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and verify Gateway image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false

      - name: Validate manually requested revision
        if: github.event_name == 'workflow_dispatch'
        env:
          COMPONENT_REVISION: ${{ inputs.revision }}
        shell: bash
        run: |
          [[ "$COMPONENT_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$COMPONENT_REVISION"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify canonical source and embedded snapshot
        run: ./scripts/check-gateway-source.sh

      - name: Run Gateway unit tests
        run: ./scripts/check.sh gateway

      - name: Build multi-architecture Gateway image without pushing
        shell: bash
        run: |
          set -euo pipefail
          mitmproxy_image=$(awk -F= '$1 == "MITMPROXY_IMAGE" { print $2 }' internal/infra/runtimeassets/assets/versions.env)
          test -n "$mitmproxy_image"
          [[ "$mitmproxy_image" == *@sha256:* ]]
          revision=$(git rev-parse HEAD)
          builder="tobari-gateway-${GITHUB_RUN_ID}"
          docker buildx create --name "$builder" --driver docker-container --use
          trap 'docker buildx rm "$builder" >/dev/null 2>&1 || true' EXIT
          docker buildx inspect --bootstrap
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file gateway/Dockerfile \
            --build-arg "MITMPROXY_IMAGE=$mitmproxy_image" \
            --label "org.opencontainers.image.revision=$revision" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --output type=cacheonly \
            gateway
