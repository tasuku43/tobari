name: Temporary finish public docs

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  finish:
    if: github.head_ref == 'agent/refresh-pages-from-main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/refresh-pages-from-main
          fetch-depth: 0
      - name: Align bilingual machine examples
        run: python3 .github/tmp_finish_pages.py
      - name: Commit parity fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/architecture-site/src/content/docs/ja/guides/authentication.mdx docs/architecture-site/src/content/docs/ja/start/authentication-setup.mdx
          if git diff --cached --quiet; then
            echo 'No parity changes.'
            exit 0
          fi
          git commit -m 'docs(site): align bilingual machine examples'
          git push origin HEAD:agent/refresh-pages-from-main
