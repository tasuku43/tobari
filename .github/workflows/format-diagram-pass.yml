name: Format diagram pass

on:
  push:
    branches:
      - agent/diagram-language-pass
    paths:
      - .github/workflows/format-diagram-pass.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/diagram-language-pass
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: docs/architecture-site/package-lock.json
      - name: Select the repository-pinned npm version
        run: npm install --global "$(node -p "require('./docs/architecture-site/package.json').packageManager")"
      - name: Install locked dependencies
        working-directory: docs/architecture-site
        run: npm ci
      - name: Format changed documentation files
        working-directory: docs/architecture-site
        run: >-
          npm run format:write --
          src/components/ConceptDiagram.astro
          src/components/SystemMap.astro
          tests/diagram-language.spec.ts
      - name: Remove this one-use workflow and commit formatting
        run: |
          rm .github/workflows/format-diagram-pass.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture-site/src/components/ConceptDiagram.astro \
                  docs/architecture-site/src/components/SystemMap.astro \
                  docs/architecture-site/tests/diagram-language.spec.ts \
                  .github/workflows/format-diagram-pass.yml
          git commit -m "style: format diagram documentation"
          git push origin HEAD:agent/diagram-language-pass
