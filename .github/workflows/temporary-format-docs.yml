name: Temporary documentation formatter

on:
  pull_request:
    paths:
      - docs/architecture-site/**
      - .github/workflows/temporary-format-docs.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the pull request merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the repository-pinned Node.js version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: docs/architecture-site/package-lock.json

      - name: Select the repository-pinned npm version
        run: npm install --global "$(node -p "require('./docs/architecture-site/package.json').packageManager")"

      - name: Install locked documentation dependencies
        working-directory: docs/architecture-site
        run: npm ci

      - name: Format the documentation source
        working-directory: docs/architecture-site
        run: npm exec -- prettier --write .

      - name: Package the formatter output
        run: tar -cf formatted-docs.tar docs/architecture-site

      - name: Upload the formatter output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formatted-docs
          path: formatted-docs.tar
          retention-days: 1
          if-no-files-found: error
