name: Temporary documentation formatter

on:
  pull_request:
    paths:
      - .github/workflows/temporary-format-docs.yml
      - docs/architecture-site/src/content/docs/reference/component-versions.mdx
      - docs/architecture-site/src/content/docs/ja/reference/component-versions.mdx

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: docs/architecture-site/package-lock.json

      - name: Select repository-pinned npm
        run: npm install --global npm@11.16.0

      - name: Install dependencies
        working-directory: docs/architecture-site
        run: npm ci

      - name: Format the synchronized pages
        working-directory: docs/architecture-site
        run: npm run format:write -- src/content/docs/reference/component-versions.mdx src/content/docs/ja/reference/component-versions.mdx

      - name: Commit formatted files and remove this workflow
        run: |
          rm .github/workflows/temporary-format-docs.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: format synchronized component references"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
