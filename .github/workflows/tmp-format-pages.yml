name: Temporary format public docs

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'agent/refresh-pages-from-main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/refresh-pages-from-main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: docs/architecture-site/package-lock.json
      - name: Select pinned npm
        run: npm install --global "$(node -p "require('./docs/architecture-site/package.json').packageManager")"
      - name: Install site dependencies
        working-directory: docs/architecture-site
        run: npm ci
      - name: Format authentication guides
        working-directory: docs/architecture-site
        run: npm exec -- prettier --write src/content/docs/guides/authentication.mdx src/content/docs/ja/guides/authentication.mdx
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/architecture-site/src/content/docs/guides/authentication.mdx docs/architecture-site/src/content/docs/ja/guides/authentication.mdx
          if git diff --cached --quiet; then
            echo 'No formatting changes.'
            exit 0
          fi
          git commit -m 'docs(site): format refreshed authentication guides'
          git push origin HEAD:agent/refresh-pages-from-main
