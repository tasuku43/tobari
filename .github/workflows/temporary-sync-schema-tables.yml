name: Temporary public JSON schema table sync

on:
  pull_request:
    paths:
      - .github/workflows/temporary-sync-schema-tables.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Replace the Catalog-owned schema tables
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('docs/architecture-site/src/content/docs')
          english = root / 'reference/json-schemas.mdx'
          japanese = root / 'ja/reference/json-schemas.mdx'

          en_table = '''## Public CLI JSON

<!-- public-cli-json-schemas:start -->

| Surface | Envelope | Current schema |
| --- | --- | ---: |
| Structured error | `error` | 1 |
| Agent help (`view: index` and input-selected `view: scope`) | `commands` | 9 |
| Version | `build_identity` | 1 |
| Doctor report | `report` | 2 |
| Context list | `contexts` | 4 |
| Context report (show/create/use/config/runtime results) | `context` | 8 |
| Cluster status | `cluster` | 5 |
| Cluster denials | `denials` | 4 |
| Policy candidates | `policy_candidates` | 5 |
| Policy review | `policy_review` | 5 |
| Policy rules | `policy_rules` | 3 |
| Policy compactions | `policy_compactions` | 3 |
| Authentication result and status | `auth` | 4 |
| Workspace list | `tobari` | 2 |
| Workspace status | `status` | 4 |
<!-- public-cli-json-schemas:end -->'''

          ja_table = '''## 公開 CLI JSON

<!-- public-cli-json-schemas:start -->

| 対象 | エンベロープ | 現在のスキーマ |
| --- | --- | ---: |
| 構造化エラー | `error` | 1 |
| エージェント向けヘルプ（`view: index` と入力で選ぶ `view: scope`） | `commands` | 9 |
| バージョン | `build_identity` | 1 |
| doctor レポート | `report` | 2 |
| Context 一覧 | `contexts` | 4 |
| Context レポート（show/create/use/config/runtime の結果） | `context` | 8 |
| クラスター状態 | `cluster` | 5 |
| クラスターの拒否 | `denials` | 4 |
| ポリシー候補 | `policy_candidates` | 5 |
| ポリシーレビュー | `policy_review` | 5 |
| ポリシー規則 | `policy_rules` | 3 |
| ポリシー圧縮 | `policy_compactions` | 3 |
| 認証結果と状態 | `auth` | 4 |
| Workspace 一覧 | `tobari` | 2 |
| Workspace 状態 | `status` | 4 |
<!-- public-cli-json-schemas:end -->'''

          def replace(path: Path, heading: str, next_text: str, table: str) -> None:
              text = path.read_text()
              pattern = re.compile(re.escape(heading) + r'.*?(?=\n\n' + re.escape(next_text) + r')', re.S)
              updated, count = pattern.subn(table, text, count=1)
              if count != 1:
                  raise SystemExit(f'{path}: expected one table section, found {count}')
              path.write_text(updated)

          replace(english, '## Public CLI JSON', 'Exact fields, optionality', en_table)
          replace(japanese, '## 公開 CLI JSON', 'フィールドの正確な内容', ja_table)
          PY

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: docs/architecture-site/package-lock.json

      - name: Select repository-pinned npm
        run: npm install --global "$(node -p "require('./docs/architecture-site/package.json').packageManager")"

      - name: Install documentation dependencies
        working-directory: docs/architecture-site
        run: npm ci

      - name: Format and validate
        run: |
          npm --prefix docs/architecture-site run format:write
          go run ./tools/contractlint
          npm --prefix docs/architecture-site run test:static

      - name: Commit and remove temporary workflow
        run: |
          rm .github/workflows/temporary-sync-schema-tables.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: synchronize public JSON schema tables"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
