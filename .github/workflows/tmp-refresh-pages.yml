name: Temporary refresh public docs

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'agent/refresh-pages-from-main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/refresh-pages-from-main
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply final documentation reconciliation
        shell: bash
        run: |
          set -euo pipefail
          go run ./tools/sitegen --write
          python3 .github/tmp_sync_pages_round2.py
      - name: Commit refreshed documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/architecture-site/src docs/architecture-site/tests
          if git diff --cached --quiet; then
            echo 'No documentation changes.'
            exit 0
          fi
          git commit -m 'docs(site): complete product contract reconciliation'
          git push origin HEAD:agent/refresh-pages-from-main
