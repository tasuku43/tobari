name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: Implementation quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: docs/architecture-site/package-lock.json

      - name: Select the repository-pinned npm version
        run: npm install --global "$(node -p "require('./docs/architecture-site/package.json').packageManager")"

      - name: Install locked site dependencies
        working-directory: docs/architecture-site
        run: npm ci

      - name: Install the pinned browser runtime
        working-directory: docs/architecture-site
        run: npm exec -- playwright install --with-deps chromium

      - name: Run the canonical full gate
        run: ./scripts/check.sh full

  boundary:
    name: Security and public boundary gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: docs/architecture-site/package-lock.json

      - name: Select the repository-pinned npm version
        run: npm install --global "$(node -p "require('./docs/architecture-site/package.json').packageManager")"

      - name: Run boundary gates
        run: |
          ./scripts/check.sh security
          ./scripts/check.sh public

  runtime:
    name: Container policy and integration gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run the container runtime gate
        run: ./scripts/check.sh runtime
