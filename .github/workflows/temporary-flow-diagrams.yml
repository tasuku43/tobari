name: Temporary flow diagram rollout

on:
  pull_request:
    paths:
      - .github/workflows/temporary-flow-diagrams.yml
      - .github/flow-payload/**

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply reviewed documentation files
        shell: bash
        run: |
          cat .github/flow-payload/part-* > /tmp/flow-diagrams.tar.xz.b64
          base64 --decode /tmp/flow-diagrams.tar.xz.b64 > /tmp/flow-diagrams.tar.xz
          echo 'a3cf5a5da8a152a21bf4b7a636c5a2d3451cfaf9a78821d0bf1c329820e1b79a  /tmp/flow-diagrams.tar.xz' | sha256sum --check --strict
          tar -xJf /tmp/flow-diagrams.tar.xz -C "$GITHUB_WORKSPACE"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: docs/architecture-site/package-lock.json

      - name: Select repository-pinned npm
        run: npm install --global "$(node -p "require('./docs/architecture-site/package.json').packageManager")"

      - name: Install documentation dependencies
        working-directory: docs/architecture-site
        run: npm ci

      - name: Validate documentation
        working-directory: docs/architecture-site
        env:
          GITHUB_SHA: ${{ github.sha }}
          SOURCE_DATE_EPOCH: '1770000000'
        run: |
          npm run format
          npm run test:locale-routes
          npm run check:locales
          npm run typecheck
          npm run build
          npm run check:dist:root
          npm run build:pages
          npm run check:dist

      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -rf .github/flow-payload .github/workflows/temporary-flow-diagrams.yml
          git add -A
          git commit -m "docs: adopt request-flow diagrams"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
