name: Agent apply static verification update

on:
  push:
    branches:
      - agent/improve-docs-learning-flow

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Apply the static home verification update
        run: |
          git apply .github/agent-verify-dist-fix.patch
          rm .github/agent-verify-dist-fix.patch
          rm .github/workflows/agent-apply-verify-dist.yml

      - name: Commit the verified source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "test(site): verify the new task-first home content"
          git push
