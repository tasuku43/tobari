name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "SemVer release tag (vMAJOR.MINOR.PATCH)"
        required: true
        type: string
      revision:
        description: "Full reviewed source commit"
        required: true
        type: string
      publish:
        description: "Publish the immutable GitHub Release after protected-environment approval"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate requested source
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.release.outputs.revision }}
      stable: ${{ steps.release.outputs.stable }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Validate requested revision shape
        env:
          RELEASE_REVISION: ${{ inputs.revision }}
        shell: bash
        run: |
          if [[ ! "${RELEASE_REVISION}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "revision must be a full lowercase Git commit SHA" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Validate release identity
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_REVISION: ${{ inputs.revision }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${RELEASE_REVISION}"
          {
            go run ./tools/releaseversion "${RELEASE_TAG}"
            echo "tag=${RELEASE_TAG}"
            echo "revision=${RELEASE_REVISION}"
          } >>"${GITHUB_OUTPUT}"
          if [[ "${RELEASE_PUBLISH}" == true ]]; then
            tag_revision=$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")
            if [[ "${tag_revision}" != "${RELEASE_REVISION}" ]]; then
              echo "published tag does not identify the requested reviewed revision" >&2
              exit 1
            fi
          fi

      - name: Run all required release preflight gates
        run: |
          ./scripts/check.sh full
          ./scripts/check.sh security
          ./scripts/check.sh release
          ./scripts/check.sh public
          ./scripts/check.sh runtime

  build:
    name: Build ${{ matrix.goos }} ${{ matrix.goarch }}
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.revision }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build and verify archive
        run: |
          ./scripts/package-release.sh \
            "${{ needs.preflight.outputs.tag }}" \
            "${{ needs.preflight.outputs.revision }}" \
            "${{ matrix.goos }}" \
            "${{ matrix.goarch }}" \
            dist

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  assemble:
    name: Assemble verified release assets
    needs: [preflight, build]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.revision }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Download archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create and verify checksums, SPDX SBOM, and provenance
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_REVISION: ${{ needs.preflight.outputs.revision }}
        shell: bash
        run: |
          builder_id="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${RELEASE_REVISION}"
          invocation_id="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          go run ./tools/releaseartifacts create "${RELEASE_TAG}" "${RELEASE_REVISION}" "${builder_id}" "${invocation_id}" dist
          go run ./tools/releaseartifacts verify "${RELEASE_TAG}" "${RELEASE_REVISION}" "${builder_id}" "${invocation_id}" dist
          for metadata in checksums.txt sbom.spdx.json provenance.intoto.jsonl; do
            test -s "dist/${metadata}"
          done

      - name: Render and audit stable Formula
        if: needs.preflight.outputs.stable == 'true'
        shell: bash
        run: |
          binary=$(go run ./tools/projectmeta --field binary_name)
          ./scripts/render-formula.sh \
            "${{ needs.preflight.outputs.tag }}" \
            "https://github.com/${GITHUB_REPOSITORY}" \
            dist/checksums.txt \
            "dist/${binary}.rb"
          ruby -c "dist/${binary}.rb"
          ./scripts/audit-formula.sh "dist/${binary}.rb"

      - name: Verify exact final release asset inventory
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_REVISION: ${{ needs.preflight.outputs.revision }}
        shell: bash
        run: |
          builder_id="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${RELEASE_REVISION}"
          invocation_id="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          go run ./tools/releaseartifacts verify-final "${RELEASE_TAG}" "${RELEASE_REVISION}" "${builder_id}" "${invocation_id}" dist

      - name: Upload complete release asset set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets-${{ needs.preflight.outputs.tag }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish immutable GitHub Release
    if: inputs.publish == true
    needs: [preflight, assemble]
    runs-on: ubuntu-latest
    environment: release-publication
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Download complete release asset set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets-${{ needs.preflight.outputs.tag }}
          path: dist

      - name: Reverify exact subjects and published tag
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_REVISION: ${{ needs.preflight.outputs.revision }}
        shell: bash
        run: |
          builder_id="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${RELEASE_REVISION}"
          invocation_id="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          test "$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")" = "${RELEASE_REVISION}"
          go run ./tools/releaseartifacts verify-final "${RELEASE_TAG}" "${RELEASE_REVISION}" "${builder_id}" "${invocation_id}" dist

      - name: Create GitHub Release without replacement
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_STABLE: ${{ needs.preflight.outputs.stable }}
        shell: bash
        run: |
          args=(--verify-tag --title "${RELEASE_TAG}" --generate-notes)
          if [[ "${RELEASE_STABLE}" != true ]]; then
            args+=(--prerelease)
          fi
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "release ${RELEASE_TAG} already exists; refusing to replace immutable release assets" >&2
            exit 1
          fi
          gh release create "${RELEASE_TAG}" dist/* "${args[@]}"
