name: Release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Prepare verified assets, or publish one successful preparation"
        required: true
        default: prepare
        type: choice
        options:
          - prepare
          - publish
      tag:
        description: "SemVer release tag (for example v0.1.0-dev.1 or v1.0.0)"
        required: true
        type: string
      revision:
        description: "Full reviewed source commit"
        required: true
        type: string
      prepared_run_id:
        description: "Successful Release preparation run ID; required only for publish"
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  identity:
    name: Validate requested release identity
    runs-on: ubuntu-latest
    outputs:
      operation: ${{ steps.release.outputs.operation }}
      revision: ${{ steps.release.outputs.revision }}
      stable: ${{ steps.release.outputs.stable }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Validate dispatch inputs
        env:
          RELEASE_OPERATION: ${{ inputs.operation }}
          RELEASE_PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          RELEASE_REVISION: ${{ inputs.revision }}
        shell: bash
        run: |
          if [[ ! "${RELEASE_REVISION}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "revision must be a full lowercase Git commit SHA" >&2
            exit 1
          fi
          case "${RELEASE_OPERATION}" in
            prepare)
              if [[ -n "${RELEASE_PREPARED_RUN_ID}" ]]; then
                echo "prepared_run_id must be empty for prepare" >&2
                exit 1
              fi
              ;;
            publish)
              if [[ ! "${RELEASE_PREPARED_RUN_ID}" =~ ^[1-9][0-9]*$ ]]; then
                echo "publish requires a positive numeric prepared_run_id" >&2
                exit 1
              fi
              ;;
            *)
              echo "unsupported release operation: ${RELEASE_OPERATION}" >&2
              exit 1
              ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Validate release identity
        id: release
        env:
          RELEASE_OPERATION: ${{ inputs.operation }}
          RELEASE_REVISION: ${{ inputs.revision }}
          RELEASE_TAG: ${{ inputs.tag }}
          WORKFLOW_REVISION: ${{ github.sha }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${RELEASE_REVISION}"
          {
            go run ./tools/releaseversion "${RELEASE_TAG}"
            echo "operation=${RELEASE_OPERATION}"
            echo "tag=${RELEASE_TAG}"
            echo "revision=${RELEASE_REVISION}"
          } >>"${GITHUB_OUTPUT}"
          if [[ "${RELEASE_OPERATION}" == prepare ]]; then
            if [[ "${WORKFLOW_REVISION}" != "${RELEASE_REVISION}" ]]; then
              echo "prepare must run from the exact requested revision on main" >&2
              exit 1
            fi
          else
            tag_revision=$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")
            if [[ "${tag_revision}" != "${RELEASE_REVISION}" ]]; then
              echo "published tag does not identify the requested reviewed revision" >&2
              exit 1
            fi
          fi

  ci-evidence:
    name: Reuse exact-revision CI evidence
    if: inputs.operation == 'prepare'
    needs: identity
    runs-on: ubuntu-latest
    steps:
      - name: Wait for successful main-push CI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REVISION: ${{ needs.identity.outputs.revision }}
        shell: bash
        run: |
          deadline=$((SECONDS + 900))
          run_id=
          while ((SECONDS < deadline)); do
            runs=$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f branch=main \
              -f event=push \
              -f head_sha="${RELEASE_REVISION}" \
              -f per_page=100)
            run_id=$(jq -r --arg revision "${RELEASE_REVISION}" '
              [.workflow_runs[] |
                select(
                  .path == ".github/workflows/ci.yml" and
                  .event == "push" and
                  .head_branch == "main" and
                  .head_sha == $revision
                )] |
              sort_by(.id) |
              last |
              .id // empty
            ' <<<"${runs}")
            if [[ -n "${run_id}" ]]; then
              break
            fi
            sleep 5
          done
          if [[ -z "${run_id}" ]]; then
            echo "no main-push CI run appeared for ${RELEASE_REVISION}" >&2
            exit 1
          fi

          run=
          while ((SECONDS < deadline)); do
            run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")
            status=$(jq -r '.status' <<<"${run}")
            if [[ "${status}" == completed ]]; then
              break
            fi
            sleep 10
          done
          if [[ -z "${run}" ]]; then
            echo "CI run ${run_id} could not be read before the evidence deadline" >&2
            exit 1
          fi
          jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg revision "${RELEASE_REVISION}" '
              .repository.full_name == $repository and
              .path == ".github/workflows/ci.yml" and
              .event == "push" and
              .head_branch == "main" and
              .head_sha == $revision and
              .status == "completed" and
              .conclusion == "success"
            ' <<<"${run}" >/dev/null
          echo "Using successful CI run ${run_id} for ${RELEASE_REVISION}."

  build:
    name: Build ${{ matrix.goos }} ${{ matrix.goarch }}
    if: inputs.operation == 'prepare'
    needs: identity
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.identity.outputs.revision }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build and verify archive
        run: |
          ./scripts/package-release.sh \
            "${{ needs.identity.outputs.tag }}" \
            "${{ needs.identity.outputs.revision }}" \
            "${{ matrix.goos }}" \
            "${{ matrix.goarch }}" \
            dist

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/tobari_*
          if-no-files-found: error
          retention-days: 1

  assemble:
    name: Assemble verified release assets
    if: inputs.operation == 'prepare'
    needs: [identity, build]
    runs-on: ${{ needs.identity.outputs.stable == 'true' && 'macos-15' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.identity.outputs.revision }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Download archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create and verify checksums, SPDX SBOM, and provenance
        env:
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
          RELEASE_REVISION: ${{ needs.identity.outputs.revision }}
        shell: bash
        run: |
          builder_id="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${RELEASE_REVISION}"
          invocation_id="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          go run ./tools/releaseartifacts create "${RELEASE_TAG}" "${RELEASE_REVISION}" "${builder_id}" "${invocation_id}" dist
          go run ./tools/releaseartifacts verify "${RELEASE_TAG}" "${RELEASE_REVISION}" "${builder_id}" "${invocation_id}" dist
          for metadata in checksums.txt sbom.spdx.json provenance.intoto.jsonl; do
            test -s "dist/${metadata}"
          done

      - name: Render and audit stable Formula
        if: needs.identity.outputs.stable == 'true'
        shell: bash
        run: |
          binary=$(go run ./tools/projectmeta --field binary_name)
          ./scripts/render-formula.sh \
            "${{ needs.identity.outputs.tag }}" \
            "https://github.com/${GITHUB_REPOSITORY}" \
            dist/checksums.txt \
            "dist/${binary}.rb"
          ruby -c "dist/${binary}.rb"
          ./scripts/audit-formula.sh "dist/${binary}.rb"

      - name: Verify exact final release asset inventory
        env:
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
          RELEASE_REVISION: ${{ needs.identity.outputs.revision }}
        shell: bash
        run: |
          builder_id="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${RELEASE_REVISION}"
          invocation_id="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          go run ./tools/releaseartifacts verify-final "${RELEASE_TAG}" "${RELEASE_REVISION}" "${builder_id}" "${invocation_id}" dist

      - name: Upload complete prepared release asset set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets-${{ needs.identity.outputs.tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish immutable GitHub Release
    if: inputs.operation == 'publish'
    needs: identity
    runs-on: ubuntu-latest
    environment: release-publication
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.identity.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Validate prepared run and exact artifact
        id: prepared
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          RELEASE_REVISION: ${{ needs.identity.outputs.revision }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
        shell: bash
        run: |
          if [[ "${PREPARED_RUN_ID}" == "${GITHUB_RUN_ID}" ]]; then
            echo "publish cannot promote its own run" >&2
            exit 1
          fi
          run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREPARED_RUN_ID}")
          jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg revision "${RELEASE_REVISION}" '
              .repository.full_name == $repository and
              .path == ".github/workflows/release.yml" and
              .event == "workflow_dispatch" and
              .head_branch == "main" and
              .head_sha == $revision and
              .status == "completed" and
              .conclusion == "success"
            ' <<<"${run}" >/dev/null
          attempt=$(jq -r '.run_attempt' <<<"${run}")
          if [[ ! "${attempt}" =~ ^[1-9][0-9]*$ ]]; then
            echo "prepared run has an invalid attempt" >&2
            exit 1
          fi

          jobs=$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${PREPARED_RUN_ID}/jobs" \
            -f filter=latest \
            -f per_page=100)
          assemble_count=$(jq '[.jobs[] | select(.name == "Assemble verified release assets" and .conclusion == "success")] | length' <<<"${jobs}")
          if [[ "${assemble_count}" != 1 ]]; then
            echo "prepared run must contain exactly one successful asset assembly job" >&2
            exit 1
          fi

          artifacts=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREPARED_RUN_ID}/artifacts?per_page=100")
          artifact_count=$(jq --arg name "release-assets-${RELEASE_TAG}" '[.artifacts[] | select(.name == $name and .expired == false)] | length' <<<"${artifacts}")
          if [[ "${artifact_count}" != 1 ]]; then
            echo "prepared run must contain exactly one unexpired complete release asset set" >&2
            exit 1
          fi
          echo "attempt=${attempt}" >>"${GITHUB_OUTPUT}"

      - name: Download complete prepared release asset set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets-${{ needs.identity.outputs.tag }}
          path: dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.prepared_run_id }}
          digest-mismatch: error

      - name: Reverify exact prepared subjects and published tag
        env:
          PREPARED_RUN_ATTEMPT: ${{ steps.prepared.outputs.attempt }}
          PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
          RELEASE_REVISION: ${{ needs.identity.outputs.revision }}
        shell: bash
        run: |
          builder_id="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${RELEASE_REVISION}"
          invocation_id="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${PREPARED_RUN_ID}/attempts/${PREPARED_RUN_ATTEMPT}"
          test "$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")" = "${RELEASE_REVISION}"
          go run ./tools/releaseartifacts verify-final "${RELEASE_TAG}" "${RELEASE_REVISION}" "${builder_id}" "${invocation_id}" dist

      - name: Create GitHub Release without replacement
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_STABLE: ${{ needs.identity.outputs.stable }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
        shell: bash
        run: |
          args=(--verify-tag --title "${RELEASE_TAG}" --generate-notes)
          if [[ "${RELEASE_STABLE}" != true ]]; then
            args+=(--prerelease)
          fi
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "release ${RELEASE_TAG} already exists; refusing to replace immutable release assets" >&2
            exit 1
          fi
          gh release create "${RELEASE_TAG}" dist/* "${args[@]}"

  homebrew-tap:
    name: Propose stable Formula in Homebrew tap
    if: inputs.operation == 'publish' && needs.identity.outputs.stable == 'true'
    needs: [identity, publish]
    runs-on: ubuntu-latest
    environment: release-publication
    permissions:
      contents: read
    steps:
      - name: Download the exact published Formula
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
        shell: bash
        run: |
          mkdir formula-dist
          gh release download "${RELEASE_TAG}" \
            --repo "${RELEASE_REPOSITORY}" \
            --pattern tobari.rb \
            --dir formula-dist
          test -f formula-dist/tobari.rb
          test "$(find formula-dist -type f | wc -l | tr -d ' ')" = 1
          ruby -c formula-dist/tobari.rb

      - name: Create repository-scoped Homebrew App token
        id: homebrew-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.HOMEBREW_APP_ID }}
          private-key: "${{ secrets.HOMEBREW_APP_KEY }}"
          owner: tasuku43
          repositories: homebrew-tap

      - name: Checkout shared Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: tasuku43/homebrew-tap
          token: ${{ steps.homebrew-token.outputs.token }}
          path: homebrew-tap

      - name: Install the verified Formula into the tap
        shell: bash
        run: |
          install -m 0644 formula-dist/tobari.rb homebrew-tap/Formula/tobari.rb
          ruby -c homebrew-tap/Formula/tobari.rb
          test "$(git -C homebrew-tap status --short | awk '{print $2}')" = Formula/tobari.rb

      - name: Create Homebrew Formula pull request
        working-directory: homebrew-tap
        env:
          GH_TOKEN: ${{ steps.homebrew-token.outputs.token }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
        shell: bash
        run: |
          branch="chore/homebrew-formula-${RELEASE_TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git add Formula/tobari.rb
          git commit -m "Update Homebrew formula for ${RELEASE_TAG}"
          git push origin "${branch}"
          gh pr create \
            --repo tasuku43/homebrew-tap \
            --base main \
            --head "${branch}" \
            --title "Update Homebrew formula for ${RELEASE_TAG}" \
            --body "Updates Formula/tobari.rb to the audited immutable GitHub Release artifact for ${RELEASE_TAG}."
