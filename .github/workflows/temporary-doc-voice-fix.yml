name: Temporary documentation voice fix

on:
  push:
    branches:
      - agent/docs-publisher-voice

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.event.head_commit.message != 'docs: use publisher voice in security documentation' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: docs/architecture-site/package-lock.json

      - name: Select repository-pinned npm
        run: npm install --global "$(node -p "require('./docs/architecture-site/package.json').packageManager")"

      - name: Install documentation dependencies
        working-directory: docs/architecture-site
        run: npm ci

      - name: Rewrite documentation voice
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('docs/architecture-site')

          def replace_exact(path, pairs):
              p = root / path
              text = p.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected one match for {old!r}, found {count}')
                  text = text.replace(old, new)
              p.write_text(text)

          def replace_evidence_aside(path, replacement):
              p = root / path
              text = p.read_text()
              pattern = r'\n<aside class="evidence">.*?</aside>\n'
              text, count = re.subn(pattern, '\n' + replacement + '\n', text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{path}: expected one evidence aside, found {count}')
              p.write_text(text)

          replace_exact('src/components/QuickstartWalkthrough.astro', [
              ('事前にインストールを完了し、対話型ターミナルを用意してください。作業ディレクトリ内のファイルはエージェントから保護されないため、実際のリポジトリではなく空の練習用ディレクトリを使います。', '事前にインストールを完了し、対話型ターミナルを用意してください。このクイックスタートでは、標準のベースランタイムに含まれる `curl` だけを使って通信制御を確認します。コーディングエージェントや実際のリポジトリは必要ないため、空の練習用ディレクトリを使います。'),
              ('Complete installation first and use an interactive terminal. Files inside the selected project are not protected, so use the synthetic directory below instead of a real work project.', 'Complete installation first and use an interactive terminal. This quickstart uses `curl` from the standard base runtime to exercise network control directly; it does not require a coding agent or a real repository. Use the empty synthetic directory below.'),
          ])

          replace_exact('src/content/docs/ja/security/overview.mdx', [
              ('description: Tobari のセキュリティ保証を、成立する前提、強制するコンポーネント、障害時の動作、根拠、保護しない範囲に分けて説明します。', 'description: Tobari のセキュリティ保証を、成立する前提、制御の仕組み、障害時の動作、保護しない範囲に分けて説明します。'),
              ('そのため、このセクションでは「コンテナで動く」「プロキシを使う」「暗号化されている」といった説明だけで安全性を表しません。各保証について、前提、強制箇所、障害時の動作、根拠、対象外を明記します。構成要素や通信経路が分からない場合は、先に[基本モデル](../../how-it-works/mental-model/)と[システム全体像](../../how-it-works/system-overview/)を読んでください。', 'そのため、このセクションでは「コンテナで動く」「プロキシを使う」「暗号化されている」といった説明だけで安全性を表しません。各保証について、前提、制御の仕組み、障害時の動作、対象外を明記します。構成要素や通信経路が分からない場合は、先に[基本モデル](../../how-it-works/mental-model/)と[システム全体像](../../how-it-works/system-overview/)を読んでください。'),
              ('3. **強制箇所** — 保証を実際に成立させるコードまたは構成。\n4. **障害時の動作** — 強制箇所が利用できない、または不正な状態になった場合の結果。\n5. **根拠** — 規定文書、実装、テスト。\n6. **対象外** — 保証に含まれない、最も近い範囲。', '3. **仕組み** — どのコンポーネントと構成が、その保証を成立させるか。\n4. **障害時の動作** — 必要なコンポーネントが利用できない、または不正な状態になった場合の結果。\n5. **対象外** — 保証に含まれない、最も近い範囲。'),
              ('以降のページでは、保証をさらに狭い単位へ分け、それぞれを強制箇所と根拠へ結び付けます。HTTP', '以降のページでは、保証をさらに狭い単位へ分け、それぞれの前提、仕組み、障害時の動作、対象外を具体化します。HTTP'),
          ])
          replace_evidence_aside('src/content/docs/ja/security/overview.mdx', '公開仕様と、それを維持する実装・テストの対応は、[実装とテスト](../verification-evidence/)にまとめています。')

          p = root / 'src/content/docs/ja/security/guarantees-and-limitations.mdx'
          text = p.read_text()
          for old, new in [
              ('description: Tobari の主要なセキュリティ保証について、成立する前提、強制箇所、障害時の動作、根拠、対象外を対応付けます。', 'description: Tobari の主要なセキュリティ保証について、成立する前提、制御の仕組み、障害時の動作、対象外を対応付けます。'),
              ('以下では、各保証を前提、強制箇所、障害時の動作、根拠、最も近い対象外とセットで示します。共通する信頼対象と境界は、先に[セキュリティ概要](../overview/)で確認してください。', '以下では、各保証を前提、制御の仕組み、障害時の動作、最も近い対象外とセットで示します。共通する信頼対象と境界は、先に[セキュリティ概要](../overview/)で確認してください。'),
          ]:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'guarantees: expected one match, found {count}: {old}')
              text = text.replace(old, new)
          text = text.replace('**強制箇所。**', '**仕組み。**')
          text, count = re.subn(r'^\*\*根拠。\*\*.*\n\n', '', text, flags=re.M)
          if count != 5:
              raise SystemExit(f'guarantees: expected five evidence paragraphs, found {count}')
          text, count = re.subn(r'\n<aside class="evidence">.*?</aside>\n', '\n公開仕様と、それを維持する実装・テストの対応は、[実装とテスト](../verification-evidence/)にまとめています。\n', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'guarantees: expected one evidence aside, found {count}')
          p.write_text(text)

          replace_evidence_aside('src/content/docs/ja/security/trust-boundaries.mdx', '境界ごとの実装とテストを追う場合は、[実装とテスト](../verification-evidence/)を参照してください。')
          replace_evidence_aside('src/content/docs/ja/security/credential-security.mdx', '認証情報の各経路を維持する実装とテストは、[実装とテスト](../verification-evidence/)にまとめています。')

          replace_exact('src/content/docs/ja/security/verification-evidence.mdx', [
              ('title: 検証の根拠', 'title: 実装とテスト'),
              ('description: Tobari の主要なセキュリティ保証と動作を、強制箇所、テスト、規定文書、関連ソースへ対応付けます。', 'description: Tobari の公開仕様が、どの実装とテストで維持されているかを一覧にします。'),
              ('このページは、Tobari の主要なセキュリティ保証と障害時の動作を、規定する契約、実際に強制する実装、検証するテストへ対応付ける索引です。一つのテストで保証全体を証明できない場合は、構成・実装・複数のテストを組み合わせて示します。', 'このページは、Tobari の公開仕様がどの実装とテストで維持されているかを確認するための開発者向け索引です。セキュリティ上の重要な動作ごとに、関連する設計文書、実装、テストを対応付けています。'),
              ('対象は、このサイトが固定する製品ソースのコミットです。ネットワーク、プロジェクトの識別、ポリシー、TLS、認証情報、ライフサイクル、サプライチェーンについて、説明から根拠へ追えるようにしています。', '対象は、このサイトが固定する製品ソースのコミットです。ネットワーク、プロジェクトの識別、ポリシー、TLS、認証情報、ライフサイクル、サプライチェーンについて、公開仕様から関連する実装とテストへ辿れるようにしています。'),
              ('## 保証・動作と根拠の対応表', '## 公開仕様と実装・テストの対応'),
              ('## 根拠への直接リンク', '## 実装・テストへの直接リンク'),
              ('### 強制箇所とテスト', '### 実装とテスト'),
          ])
          p = root / 'src/content/docs/ja/security/verification-evidence.mdx'
          text = p.read_text()
          text, count = re.subn(r'^\| 保証または動作\s+\| 強制箇所\s+\| 主な検証\s+\| 規定文書\s+\| 関連ソース\s+\|$', '| 公開仕様 | 実装 | テスト | 設計文書 | 関連コード |', text, count=1, flags=re.M)
          if count != 1:
              raise SystemExit(f'verification table header: expected one match, found {count}')
          p.write_text(text)

          replace_exact('src/navigation.mjs', [('"検証の根拠",\n      "/security/verification-evidence/",', '"実装とテスト",\n      "/security/verification-evidence/",')])
          replace_exact('src/components/PageFooter.astro', [('製品の動作に関する説明は、参照した製品コミットに固定しています。ページ自体のソースはドキュメントのコミットに固定し、契約・実装・テストへのリンクは各ページに記載しています。', '製品の動作に関する説明は、参照した製品コミットに固定しています。ページ自体のソースはドキュメントのコミットに固定し、必要な実装・テストへの参照は対応する技術ページにまとめています。')])

      - name: Format documentation
        working-directory: docs/architecture-site
        run: npm exec -- prettier --write .

      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/architecture-site
          git commit -m "docs: use publisher voice in security documentation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
