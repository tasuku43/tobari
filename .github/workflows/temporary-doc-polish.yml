name: Temporary documentation polish

on:
  pull_request:
    paths:
      - .github/workflows/temporary-doc-polish.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Polish Japanese security overview
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/architecture-site/src/content/docs/ja/security/overview.mdx')
          text = p.read_text()
          pairs = [
            ('各ページでは、次の六項目をセットで示します。', '各ページでは、次の五項目をセットで示します。'),
            ('Gateway 自体が侵害されれば、その強制箇所は失われます。', 'Gateway 自体が侵害されれば、この境界は成立しません。'),
          ]
          for old, new in pairs:
            if text.count(old) != 1:
              raise SystemExit(f'expected one match: {old}')
            text = text.replace(old, new)
          p.write_text(text)
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/architecture-site/src/content/docs/ja/security/overview.mdx
          git commit -m "docs: polish security overview voice"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
