name: Temporary documentation source sync

on:
  pull_request:
    paths:
      - .github/docs-sync-audit.py
      - .github/workflows/temporary-docs-sync.yml
      - docs/architecture-site/**

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Skip the workflow-authored audit commit
        id: skip
        shell: bash
        run: |
          if [ "$(git log -1 --pretty=%s)" = "docs: refresh generated site data and audit drift" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply source snapshot and audit
        if: steps.skip.outputs.value != 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/docs-sync-audit.py')
          text = path.read_text()
          text = text.replace(
              r'\*\*Implemented:\*\*.*?This documentation does not present',
              r'\*\*Implemented(?: now)?:\*\*.*?This documentation does not present',
          )
          path.write_text(text)
          PY
          python3 .github/docs-sync-audit.py

      - name: Normalize bilingual machine examples and headings
        if: steps.skip.outputs.value != 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('docs/architecture-site/src/content/docs')

          def synchronize_fences(english_path: Path, japanese_path: Path) -> None:
              pattern = re.compile(r'^```[^\n]*\n.*?^```[ \t]*$', re.M | re.S)
              english = english_path.read_text()
              japanese = japanese_path.read_text()
              english_blocks = pattern.findall(english)
              japanese_blocks = pattern.findall(japanese)
              if len(english_blocks) != len(japanese_blocks):
                  raise SystemExit(
                      f'fenced example count differs: {english_path}={len(english_blocks)} '
                      f'{japanese_path}={len(japanese_blocks)}'
                  )
              iterator = iter(english_blocks)
              japanese = pattern.sub(lambda _: next(iterator), japanese)
              japanese_path.write_text(japanese)

          synchronize_fences(
              root / 'start/authentication-setup.mdx',
              root / 'ja/start/authentication-setup.mdx',
          )
          synchronize_fences(
              root / 'guides/authentication.mdx',
              root / 'ja/guides/authentication.mdx',
          )

          english_versions = root / 'reference/component-versions.mdx'
          text = english_versions.read_text()
          section = '''## Current service API compatibility

The generated Gateway API 4 and Auth Broker API 3 rows describe the interfaces required by the current source. The Gateway/Auth Broker digests in the component table are the historical API 3 / API 2 publications selected by `versions.env`. These are different kinds of identity.

A standard binary rejects that mismatch before startup. To exercise this source, run `task build:dev` and inspect `bin/tobari-dev version --format json` for the `development` resolver and compatible selected APIs. Development images are not publication authority.

'''
          if section.strip() not in text:
              text = text.replace('## CLI version behavior', section + '## CLI version behavior')
          text = text.replace('```console\ntobari version\n```', '```console\ntobari version --format json\n```')
          english_versions.write_text(text)
          PY

      - name: Set up Go
        if: steps.skip.outputs.value != 'true'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        if: steps.skip.outputs.value != 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: docs/architecture-site/package-lock.json

      - name: Select repository-pinned npm
        if: steps.skip.outputs.value != 'true'
        run: npm install --global npm@11.16.0

      - name: Install documentation dependencies
        if: steps.skip.outputs.value != 'true'
        working-directory: docs/architecture-site
        run: npm ci

      - name: Regenerate and verify the static site
        if: steps.skip.outputs.value != 'true'
        working-directory: docs/architecture-site
        env:
          GITHUB_SHA: 3a9acc9c264d3e4efca2cd9aafabc9a122b183b8
          SOURCE_DATE_EPOCH: '1786448400'
        run: |
          npm run generate
          npm run format:write
          npm run test:static

      - name: Commit refreshed generated data and audit
        if: steps.skip.outputs.value != 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/architecture-site
          if git diff --cached --quiet; then
            echo "No documentation changes were produced."
            exit 0
          fi
          git commit -m "docs: refresh generated site data and audit drift"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
