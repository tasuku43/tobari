name: Runtime base

on:
  pull_request:
    paths:
      - runtimes/base/**
      - runtimes/claude/runtime.lock.json
      - runtimes/codex/runtime.lock.json
      - runtimes/manifest.json
      - internal/infra/runtimeassets/assets/tobari/**
      - internal/infra/runtimeassets/_helper-source/**
      - internal/infra/runtimeassets/assets/versions.env
      - scripts/check-runtime-base.sh
      - scripts/sync-runtime-base.sh
      - scripts/exposure-helper-source-files.py
      - scripts/check-exposure-helper-source.sh
      - scripts/sync-exposure-helper-source.sh
      - cmd/tobari-expose/**
      - tools/runtimecheck/**
      - .github/workflows/runtime-base.yml
  push:
    branches: [main]
    paths:
      - runtimes/base/**
      - runtimes/claude/runtime.lock.json
      - runtimes/codex/runtime.lock.json
      - runtimes/manifest.json
      - internal/infra/runtimeassets/assets/tobari/**
      - internal/infra/runtimeassets/_helper-source/**
      - internal/infra/runtimeassets/assets/versions.env
      - scripts/check-runtime-base.sh
      - scripts/sync-runtime-base.sh
      - scripts/exposure-helper-source-files.py
      - scripts/check-exposure-helper-source.sh
      - scripts/sync-exposure-helper-source.sh
      - cmd/tobari-expose/**
      - tools/runtimecheck/**
      - .github/workflows/runtime-base.yml

permissions:
  contents: read

concurrency:
  group: runtime-base-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build agent-ready base without publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate base source and embedded snapshot
        run: ./scripts/check-runtime-base.sh

      - name: Build multi-architecture base image without publishing
        shell: bash
        run: |
          set -euo pipefail
          base_image=$(go run ./tools/runtimecheck --print-base-image)
          builder="tobari-runtime-${GITHUB_RUN_ID}"
          docker buildx create --name "$builder" --driver docker-container --use
          trap 'docker buildx rm "$builder" >/dev/null 2>&1 || true' EXIT
          docker buildx inspect --bootstrap
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file runtimes/base/Dockerfile \
            --build-arg "DEBIAN_IMAGE=$base_image" \
            --build-arg "GO_BUILDER_IMAGE=$(awk -F= '$1 == \"GO_BUILDER_IMAGE\" { print $2 }' internal/infra/runtimeassets/assets/versions.env)" \
            --build-arg "TOBARI_EXPOSURE_HELPER_SOURCE=$(go run ./tools/runtimeassetid exposure-helper)" \
            --build-arg TOBARI_UID=1000 \
            --build-arg TOBARI_GID=1000 \
            --build-context helper-source=internal/infra/runtimeassets/_helper-source \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=main-${GITHUB_SHA:0:12}" \
            --output type=cacheonly \
            runtimes/base
