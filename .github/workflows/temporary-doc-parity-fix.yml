name: Temporary documentation parity fix

on:
  pull_request:
    paths:
      - .github/workflows/temporary-doc-parity-fix.yml
      - docs/architecture-site/**

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Check whether already applied
        id: applied
        run: |
          if [ "$(git log -1 --pretty=%s)" = "docs: align implementation references across locales" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.applied.outputs.skip != 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: docs/architecture-site/package-lock.json

      - name: Select repository-pinned npm
        if: steps.applied.outputs.skip != 'true'
        run: npm install --global "$(node -p "require('./docs/architecture-site/package.json').packageManager")"

      - name: Install documentation dependencies
        if: steps.applied.outputs.skip != 'true'
        working-directory: docs/architecture-site
        run: npm ci

      - name: Align English information architecture
        if: steps.applied.outputs.skip != 'true'
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('docs/architecture-site')

          def one_replace(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}: {old!r}')
              return text.replace(old, new)

          def replace_aside(path, replacement):
              p = root / path
              text = p.read_text()
              text, count = re.subn(r'\n<aside class="evidence">.*?</aside>\n', '\n' + replacement + '\n', text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{path}: expected one evidence aside, found {count}')
              p.write_text(text)

          p = root / 'src/content/docs/security/overview.mdx'
          text = p.read_text()
          text = one_replace(text, 'description: Read Tobari security as bounded claims with explicit assumptions, enforcement points, failure behavior, evidence, and limits.', 'description: Read Tobari security as bounded claims with explicit assumptions, enforcement points, failure behavior, and limits.', 'overview description')
          text = one_replace(text, 'assumptions, enforcement point, closed failure, evidence, and limitation.', 'assumptions, enforcement point, closed failure, and limitation.', 'overview intro')
          text = one_replace(text, '## Read every claim in six parts', '## Read every claim in five parts', 'overview heading')
          text = one_replace(text, '3. **Enforcement point** — the code or topology that makes the claim true.\n4. **Failure behavior** — what happens when that point is missing or unhealthy.\n5. **Evidence** — governing documents, implementation, and tests.\n6. **Limitations** — nearby outcomes that the claim deliberately does not cover.', '3. **Enforcement point** — the component or topology that makes the claim true.\n4. **Failure behavior** — what happens when that point is missing or unhealthy.\n5. **Limitations** — nearby outcomes that the claim deliberately does not cover.', 'overview list')
          text = one_replace(text, 'The remaining security pages state narrower claims and link each one to an\n    enforcement point and evidence.', 'The remaining security pages state narrower claims with explicit\n    preconditions, enforcement points, failure behavior, and limitations.', 'overview guarantee')
          p.write_text(text)
          replace_aside('src/content/docs/security/overview.mdx', 'For developers who want to trace public behavior into the repository, see [Implementation and tests](../verification-evidence/).')

          p = root / 'src/content/docs/security/guarantees-and-limitations.mdx'
          text = p.read_text()
          text = one_replace(text, 'description: The major Tobari security claims, each paired with preconditions, enforcement, failure behavior, evidence, and a nearby limitation.', 'description: The major Tobari security claims, each paired with preconditions, enforcement, failure behavior, and a nearby limitation.', 'guarantees description')
          text = one_replace(text, 'Each claim below states its preconditions, enforcement point, failure behavior,\nevidence, and nearest limitation.', 'Each claim below states its preconditions, enforcement point, failure behavior,\nand nearest limitation.', 'guarantees intro')
          text, count = re.subn(r'^\*\*Evidence\.\*\*.*?\n\n', '', text, flags=re.M | re.S)
          if count != 5:
              raise SystemExit(f'guarantees: expected five Evidence paragraphs, found {count}')
          text, count = re.subn(r'\n<aside class="evidence">.*?</aside>\n', '\nFor developers who want to trace these claims into the repository, see [Implementation and tests](../verification-evidence/).\n', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'guarantees: expected one evidence aside, found {count}')
          p.write_text(text)

          replace_aside('src/content/docs/security/trust-boundaries.mdx', 'For the implementation and tests behind these boundaries, see [Implementation and tests](../verification-evidence/).')
          replace_aside('src/content/docs/security/credential-security.mdx', 'For the implementation and tests behind these credential paths, see [Implementation and tests](../verification-evidence/).')

          p = root / 'src/content/docs/security/verification-evidence.mdx'
          text = p.read_text()
          for old, new, label in [
              ('title: Verification evidence', 'title: Implementation and tests', 'verification title'),
              ('description: A traceability map from security claims to enforcement points, tests, governing documents, and relevant source.', 'description: A developer index showing which implementation and tests maintain Tobari public security behavior.', 'verification description'),
              ("This page maps Tobari's important security claims to their governing contract,\nenforcement source, and tests. Where no single test proves the whole claim, the\ntable identifies the required combination of configuration and implementation\nevidence instead of implying stronger coverage.", "This page is a developer index for tracing Tobari's public security behavior into the repository. It maps important behavior to the relevant design documents, implementation, and tests.", 'verification intro'),
              ('Use it to verify topology, principal, policy, TLS, credential, lifecycle, and\nsupply-chain claims against the commit fixed by this documentation.', 'Use it to inspect topology, principal, policy, TLS, credential, lifecycle, and\nsupply-chain implementation at the commit fixed by this documentation.', 'verification scope'),
              ('## Evidence map', '## Public behavior, implementation, and tests', 'verification heading'),
          ]:
              text = one_replace(text, old, new, label)
          p.write_text(text)

          p = root / 'src/navigation.mjs'
          text = p.read_text()
          text = one_replace(text, '"Verification evidence",\n      "実装とテスト",', '"Implementation and tests",\n      "実装とテスト",', 'navigation')
          p.write_text(text)

          p = root / 'src/components/PageFooter.astro'
          text = p.read_text()
          text = one_replace(text, 'Product claims are tied to the product snapshot; page source is tied to the documentation build. Follow each page’s evidence links for the governing contract, implementation, and tests.', 'Product behavior is tied to the product snapshot; page source is tied to the documentation build. Implementation and test references are collected on the relevant technical pages.', 'footer')
          p.write_text(text)

      - name: Format documentation
        if: steps.applied.outputs.skip != 'true'
        working-directory: docs/architecture-site
        run: npm exec -- prettier --write .

      - name: Commit and push
        if: steps.applied.outputs.skip != 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/architecture-site
          git commit -m "docs: align implementation references across locales"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
