name: Temporary runtime onboarding rollout

on:
  push:
    branches:
      - agent/promote-custom-runtime-onboarding

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.head_commit.message != 'docs: promote custom runtime onboarding' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply cross-links and coverage
        shell: python
        run: |
          from pathlib import Path

          root = Path("docs/architecture-site")

          def replace_once(relative, old, new):
              path = root / relative
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{relative}: expected one match, found {count}: {old!r}")
              path.write_text(text.replace(old, new))

          replace_once(
              "src/components/HomeExperience.astro",
              '''  {
              href: "/start/quickstart/",
              title: t("I want to try it", "まず動かす"),
              detail: t(
                "Experience denial, review, allow, and deliberate retry in a synthetic project.",
                "拒否、レビュー、許可、再実行までを、練習用ディレクトリで確認します。",
              ),
            },
            {
              href: "/start/first-denial/",''',
              '''  {
              href: "/start/quickstart/",
              title: t("I want to try it", "まず動かす"),
              detail: t(
                "Experience denial, review, allow, and deliberate retry in a synthetic project.",
                "拒否、レビュー、許可、再実行までを、練習用ディレクトリで確認します。",
              ),
            },
            {
              href: "/start/runtime-setup/",
              title: t(
                "I need my coding agent and toolchain",
                "エージェントと開発ツールを入れる",
              ),
              detail: t(
                "Build and validate a Context-owned runtime before using a real repository.",
                "実際のリポジトリで使う前に、Context 管理のランタイムをビルドして検証します。",
              ),
            },
            {
              href: "/start/first-denial/",''',
          )

          replace_once(
              "src/components/QuickstartWalkthrough.astro",
              '''      nextTitle: "必要に応じて詳細を確認する",
              nextLinks: [
                ["拒否された通信のレビュー", "/start/first-denial/"],''',
              '''      nextTitle: "次に、実作業用のランタイムを用意する",
              nextLinks: [
                [
                  "カスタムランタイムを用意する（実作業の前に必要）",
                  "/start/runtime-setup/",
                ],
                ["拒否された通信のレビュー", "/start/first-denial/"],''',
          )
          replace_once(
              "src/components/QuickstartWalkthrough.astro",
              '''      nextTitle: "Read only the detail you need next",
              nextLinks: [
                ["What to inspect after a denial", "/start/first-denial/"],''',
              '''      nextTitle: "Next, prepare the runtime for real work",
              nextLinks: [
                [
                  "Prepare a custom runtime (required before real project work)",
                  "/start/runtime-setup/",
                ],
                ["What to inspect after a denial", "/start/first-denial/"],''',
          )

          replace_once(
              "src/content/docs/start/first-denial.mdx",
              "**Next:** [Follow the recommended learning path](../learning-path/).",
              "**Next:** [Prepare a custom runtime for real work](../runtime-setup/).",
          )
          replace_once(
              "src/content/docs/ja/start/first-denial.mdx",
              "**次へ:** [学習ガイドに沿って読む](../learning-path/)。",
              "**次へ:** [実作業用のカスタムランタイムを用意する](../runtime-setup/)。",
          )

          replace_once(
              "src/content/docs/guides/runtime-customization.mdx",
              '''Add project tools by initializing the current Context's owner-only Dockerfile recipe, editing it on the trusted host, and running an explicit `runtime build`. The next Workspace entry reconciles the work container while preserving the logical Workspace identity and persistent home.

Before starting, identify the current Context; see [Contexts](../contexts/).''',
              '''If you have only completed Quickstart, begin with [Prepare a custom runtime](../../start/runtime-setup/). That page covers the shortest path from the minimal base runtime to a verified coding-agent command inside a real Workspace.

This page is the detailed guide to Context ownership, image promotion, compatibility, drift reconciliation, and failure recovery. Add project tools by initializing the current Context's owner-only Dockerfile recipe, editing it on the trusted host, and running an explicit `runtime build`. The next Workspace entry reconciles the work container while preserving the logical Workspace identity and persistent home.

Before starting, identify the current Context; see [Contexts](../contexts/).''',
          )
          replace_once(
              "src/content/docs/ja/guides/runtime-customization.mdx",
              '''プロジェクトへツールを追加するには、現在の Context にある所有者専用の Dockerfile レシピを初期化します。信頼するホストで編集してから、明示的に `runtime build` を実行してください。次に Workspace へ入るときは作業コンテナだけが調整され、論理 Workspace の識別情報と永続ホームは維持されます。

作業前に現在の Context を確認してください。詳しくは [Context](../contexts/)を参照してください。''',
              '''クイックスタートだけを完了した場合は、先に[カスタムランタイムを用意する](../../start/runtime-setup/)へ進んでください。最小のベースランタイムから、実際の Workspace 内でコーディングエージェントのコマンドを確認するまでを短い手順で説明します。

このページでは、Context による所有、イメージの採用、互換性検査、構成差分の調整、失敗からの復旧を詳しく説明します。プロジェクトへツールを追加するには、現在の Context にある所有者専用の Dockerfile レシピを初期化します。信頼するホストで編集してから、明示的に `runtime build` を実行してください。次に Workspace へ入るときは作業コンテナだけが調整され、論理 Workspace の識別情報と永続ホームは維持されます。

作業前に現在の Context を確認してください。詳しくは [Context](../contexts/)を参照してください。''',
          )

          replace_once(
              "src/content/docs/reference/runtime-image-contract.mdx",
              '''The image supplies tools and a root filesystem; the host still owns mounts,
              resources, network, and Workspace lifetime. For the workflow that creates and
              selects an image, use [Runtime
              customization](/guides/runtime-customization/).''',
              '''The image supplies tools and a root filesystem; the host still owns mounts,
              resources, network, and Workspace lifetime. For first use, follow [Prepare a
              custom runtime](/start/runtime-setup/). For exact build, selection, and recovery
              behavior, use [Runtime customization details](/guides/runtime-customization/).''',
          )
          replace_once(
              "src/content/docs/ja/reference/runtime-image-contract.mdx",
              '''イメージが提供するのはツールとルートファイルシステムです。マウント、リソース、
              ネットワーク、Workspace の寿命は、引き続きホストが管理します。イメージの作成と選択の流れは、
              [ランタイムのカスタマイズ](../../guides/runtime-customization/)を参照してください。''',
              '''イメージが提供するのはツールとルートファイルシステムです。マウント、リソース、
              ネットワーク、Workspace の寿命は、引き続きホストが管理します。最初の導入は、
              [カスタムランタイムを用意する](../../start/runtime-setup/)に沿って進めてください。ビルド、選択、復旧の正確な動作は、
              [ランタイムの詳細設定](../../guides/runtime-customization/)で説明します。''',
          )

          replace_once(
              "tests/learning-flow.spec.ts",
              '''    await expect(
                page.getByRole("link", { name: "通信が拒否された" }),
              ).toHaveAttribute("href", /\\/ja\\/start\\/first-denial\\/$/);
              await expect(page.locator(".home-tasks > a")).toHaveCount(5);''',
              '''    await expect(
                page.getByRole("link", { name: "通信が拒否された" }),
              ).toHaveAttribute("href", /\\/ja\\/start\\/first-denial\\/$/);
              await expect(
                page.getByRole("link", { name: "エージェントと開発ツールを入れる" }),
              ).toHaveAttribute("href", /\\/ja\\/start\\/runtime-setup\\/$/);
              await expect(page.locator(".home-tasks > a")).toHaveCount(6);''',
          )
          replace_once(
              "tests/learning-flow.spec.ts",
              '''    await expect(
                page.getByRole("heading", { name: "What you have now verified" }),
              ).toBeVisible();
              await expect(page.locator("tobari-sequence-explorer")).toHaveCount(0);''',
              '''    await expect(
                page.getByRole("heading", { name: "What you have now verified" }),
              ).toBeVisible();
              await expect(
                page.getByRole("link", {
                  name: "Prepare a custom runtime (required before real project work)",
                }),
              ).toHaveAttribute("href", /\\/start\\/runtime-setup\\/$/);
              await expect(page.locator("tobari-sequence-explorer")).toHaveCount(0);''',
          )
          replace_once(
              "tests/learning-flow.spec.ts",
              '''    await expect(page.locator(".learning-badge-step")).toHaveText("1 / 10");
              await expect(page.locator("nav.learning-progress")).toBeVisible();
              await expect(
                page.locator("nav.learning-progress .learning-next strong"),
              ).toHaveText("Mental model");''',
              '''    await expect(page.locator(".learning-badge-step")).toHaveText("1 / 11");
              await expect(page.locator("nav.learning-progress")).toBeVisible();
              await expect(
                page.locator("nav.learning-progress .learning-next strong"),
              ).toHaveText("Quickstart");''',
          )
          replace_once(
              "tests/learning-flow.spec.ts",
              '''  test("learning pages show current position and the next learning goal", async ({
                page,
              }) => {''',
              '''  test("custom runtime setup is an explicit onboarding step", async ({ page }) => {
                await page.goto("start/runtime-setup/");

                await expect(
                  page.getByRole("heading", {
                    name: "Quickstart verifies policy control; it does not install a coding agent",
                  }),
                ).toBeVisible();
                await expect(page.locator(".runtime-flow > li")).toHaveCount(5);
                await expect(page.locator(".runtime-steps > li")).toHaveCount(5);
                await expect(page.locator(".learning-badge-step")).toHaveText("3 / 11");
              });

              test("learning pages show current position and the next learning goal", async ({
                page,
              }) => {''',
          )

          replace_once(
              "tests/site.spec.ts",
              '''  "start/quickstart/",
              "how-it-works/system-overview/",''',
              '''  "start/quickstart/",
              "start/runtime-setup/",
              "how-it-works/system-overview/",''',
          )
          replace_once(
              "tests/site.spec.ts",
              '''  "ja/",
              "ja/how-it-works/credentials/",''',
              '''  "ja/",
              "ja/start/runtime-setup/",
              "ja/how-it-works/credentials/",''',
          )

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: docs/architecture-site/package-lock.json

      - name: Select repository-pinned npm
        run: npm install --global "$(node -p "require('./docs/architecture-site/package.json').packageManager")"

      - name: Install documentation dependencies
        working-directory: docs/architecture-site
        run: npm ci

      - name: Format and verify static documentation
        working-directory: docs/architecture-site
        env:
          GITHUB_SHA: ${{ github.sha }}
          SOURCE_DATE_EPOCH: '1770000000'
        run: |
          npm run format:write
          npm run test:static

      - name: Install browser runtime
        working-directory: docs/architecture-site
        run: npm exec -- playwright install --with-deps chromium

      - name: Run browser and accessibility tests
        working-directory: docs/architecture-site
        run: npm run test:browser

      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/temporary-runtime-onboarding.yml
          git add -A
          git commit -m "docs: promote custom runtime onboarding"
          git push origin "HEAD:${GITHUB_REF_NAME}"
