name: Temporary runtime onboarding rollout

on:
  pull_request:
    paths:
      - .github/scripts/apply-runtime-onboarding.py
      - .github/workflows/temporary-runtime-onboarding.yml
      - docs/architecture-site/**

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply cross-links and coverage
        run: python .github/scripts/apply-runtime-onboarding.py

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: docs/architecture-site/package-lock.json

      - name: Select repository-pinned npm
        run: npm install --global "$(node -p "require('./docs/architecture-site/package.json').packageManager")"

      - name: Install documentation dependencies
        working-directory: docs/architecture-site
        run: npm ci

      - name: Format and verify static documentation
        working-directory: docs/architecture-site
        env:
          GITHUB_SHA: ${{ github.sha }}
          SOURCE_DATE_EPOCH: '1770000000'
        run: |
          npm run format:write
          npm run test:static

      - name: Install browser runtime
        working-directory: docs/architecture-site
        run: npm exec -- playwright install --with-deps chromium

      - name: Run browser and accessibility tests
        working-directory: docs/architecture-site
        run: npm run test:browser

      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/scripts/apply-runtime-onboarding.py
          rm -f .github/workflows/temporary-runtime-onboarding.yml
          git add -A
          git commit -m "docs: promote custom runtime onboarding"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
