version: '3'

tasks:
  build:
    desc: Build source-coupled local images and the release-surface CLI binary.
    cmds:
      - ./scripts/build-dev-images.sh
      - mkdir -p bin
      # Local builds retain the compiled dev version and record only the exact
      # source commit. Dirty state, branches, paths, and usernames are excluded.
      - go build -tags=tobari_dev -buildvcs=false -trimpath -o bin/tobari -ldflags "-X main.commit=$(git rev-parse --verify HEAD)" ./cmd/tobari
      - 'printf "Built %s\nIf this repository bin directory is not on PATH, run: install -m 0755 bin/tobari ~/.local/bin/tobari\n" bin/tobari'

  build:dev:
    desc: Build the research-surface development CLI and local images.
    cmds:
      - ./scripts/build-dev-images.sh --research
      - mkdir -p bin
      - go build -tags='tobari_dev tobari_research' -buildvcs=false -trimpath -o bin/tobari-research -ldflags "-X main.commit=$(git rev-parse --verify HEAD)" ./cmd/tobari
      - 'printf "Built %s using the research surface and source-addressed local component images\nRun it directly, or install it with: install -m 0755 bin/tobari-research ~/.local/bin/tobari-research\n" bin/tobari-research'

  contracts:check:
    desc: Validate the command catalog, capability ledger, and external schema fixtures.
    cmds:
      - go run ./tools/contractlint

  policy:test:
    desc: Format-check and test the embedded OPA policy in the pinned OPA image.
    cmds:
      - ./scripts/check.sh policy

  gateway:test:
    desc: Test the mitmproxy Gateway addon in the pinned Gateway image.
    cmds:
      - ./scripts/check.sh gateway

  gateway:source:sync:
    desc: Synchronize the canonical Gateway source into the embedded snapshot.
    cmds:
      - ./scripts/sync-gateway-source.sh

  authbroker:test:
    desc: Test the Auth Broker in the pinned Python base image.
    cmds:
      - ./scripts/check.sh authbroker

  first-use:test:
    desc: Run the release-surface cold first-use Docker scenario from absent XDG roots and Tobari images.
    cmds:
      - ./scripts/check.sh first-use

  upgrade:test:
    desc: Run the previous-development-release to candidate Workspace re-entry scenario.
    cmds:
      - ./scripts/check.sh upgrade

  authbroker:source:sync:
    desc: Synchronize the canonical Auth Broker source into the embedded snapshot.
    cmds:
      - ./scripts/sync-authbroker-source.sh

  integration:test:
    desc: Run cold first use plus the research-surface Auth Broker network, TLS, policy, credential, and lifecycle tests.
    cmds:
      - ./scripts/check.sh integration

  runtime:base:sync:
    desc: Synchronize the canonical base image into the embedded runtime snapshot.
    cmds:
      - ./scripts/sync-runtime-base.sh

  runtime:test:
    desc: Run release-surface policy and Gateway tests plus research-surface Auth Broker integration tests.
    cmds:
      - ./scripts/check.sh runtime

  runtime:release:
    desc: Run policy, Gateway, and cold first-use release-surface container gates; deferred research tests are excluded.
    cmds:
      - ./scripts/check.sh runtime-release

  site:install:
    desc: Install the exact public-site dependency graph from its lockfile.
    dir: docs/architecture-site
    cmds:
      - npm ci

  site:generate:
    desc: Regenerate Catalog-derived CLI and repository-derived version references.
    dir: docs/architecture-site
    cmds:
      - npm run generate

  site:check:
    desc: Run the complete static, accessibility, interaction, and responsive site gate.
    cmds:
      - ./scripts/check-site.sh full

  site:build:
    desc: Build the deployable GitHub Pages artifact under /tobari/.
    dir: docs/architecture-site
    cmds:
      - npm run build:pages
      - npm run check:dist

  site:dev:
    desc: Serve the public documentation locally at the root path.
    dir: docs/architecture-site
    cmds:
      - npm run dev

  check:fast:
    desc: Run the quick local and agent completion gate.
    cmds:
      - ./scripts/check.sh fast

  check:
    desc: Run the required implementation-quality gate.
    cmds:
      - ./scripts/check.sh full

  security:
    desc: Run dependency, vulnerability, static security, and secret checks.
    cmds:
      - ./scripts/check.sh security

  release:check:
    desc: Validate release scripts, workflow, artifacts, and Formula contracts.
    cmds:
      - ./scripts/check.sh release

  public:check:
    desc: Validate that the repository is safe to publish.
    cmds:
      - ./scripts/check.sh public
