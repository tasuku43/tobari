version: '3'

tasks:
  build:
    desc: Build source-coupled local images and the standard-profile CLI binary.
    cmds:
      - ./scripts/build-dev-images.sh
      - mkdir -p bin
      # Local builds retain the compiled dev version and record only the exact
      # source commit. Dirty state, branches, paths, and usernames are excluded.
      - go build -tags=tobari_dev -buildvcs=false -trimpath -o bin/tobari -ldflags "-X main.commit=$(git rev-parse --verify HEAD)" ./cmd/tobari
      - 'printf "Built %s\nIf this repository bin directory is not on PATH, run: install -m 0755 bin/tobari ~/.local/bin/tobari\n" bin/tobari'

  build:dev:
    desc: Build the experimental-profile development CLI and local images.
    cmds:
      - ./scripts/build-dev-images.sh --experimental
      - mkdir -p bin
      - go build -tags='tobari_dev tobari_experimental' -buildvcs=false -trimpath -o bin/tobari-dev -ldflags "-X main.commit=$(git rev-parse --verify HEAD)" ./cmd/tobari
      - 'printf "Built %s using the experimental capability profile, content-addressed local component images, and tobari-runtime:dev\nRun it directly, or install it with: install -m 0755 bin/tobari-dev ~/.local/bin/tobari-dev\n" bin/tobari-dev'

  test:
    desc: Run the Go test suite.
    cmds:
      - go test ./...

  test:race:
    desc: Run the Go test suite with the race detector.
    cmds:
      - go test -race ./...

  test:experimental:
    desc: Run the Go test suite with experimental capabilities compiled in.
    cmds:
      - go test -tags='tobari_dev tobari_experimental' ./internal/app/authcmd ./internal/cli ./internal/domain/authbroker ./internal/domain/buildidentity ./internal/domain/capabilityprofile ./internal/infra/authproviders ./internal/infra/dockerruntime

  contracts:check:
    desc: Validate the command catalog, capability ledger, and external schema fixtures.
    cmds:
      - go run ./tools/contractlint

  policy:test:
    desc: Format-check and test the embedded OPA policy in the pinned OPA image.
    cmds:
      - ./scripts/check.sh policy

  gateway:test:
    desc: Test the mitmproxy Gateway addon in the pinned Gateway image.
    cmds:
      - ./scripts/check.sh gateway

  gateway:source:check:
    desc: Verify the embedded Gateway snapshot matches the canonical source.
    cmds:
      - ./scripts/check-gateway-source.sh

  gateway:source:sync:
    desc: Synchronize the canonical Gateway source into the embedded snapshot.
    cmds:
      - ./scripts/sync-gateway-source.sh

  authbroker:test:
    desc: Test the Auth Broker in the pinned Python base image.
    cmds:
      - ./scripts/check.sh authbroker

  authbroker:image:check:
    desc: Verify the Auth Broker image source contract.
    cmds:
      - ./scripts/check-authbroker-image.sh

  authbroker:source:check:
    desc: Verify the embedded Auth Broker snapshot matches the canonical source.
    cmds:
      - ./scripts/check-authbroker-source.sh

  authbroker:source:sync:
    desc: Synchronize the canonical Auth Broker source into the embedded snapshot.
    cmds:
      - ./scripts/sync-authbroker-source.sh

  integration:test:
    desc: Run the experimental Auth Broker network, TLS, policy, credential, and lifecycle tests.
    cmds:
      - ./scripts/check.sh integration

  runtime:base:check:
    desc: Validate the canonical base image and embedded runtime snapshot.
    cmds:
      - ./scripts/check-runtime-base.sh

  runtime:base:sync:
    desc: Synchronize the canonical base image into the embedded runtime snapshot.
    cmds:
      - ./scripts/sync-runtime-base.sh

  runtime:claude:check:
    desc: Validate the Claude agent image metadata, lock, and inherited contract.
    cmds:
      - ./scripts/check-runtime-claude.sh

  runtime:claude:build:
    desc: Build and validate the local Claude agent runtime image.
    cmds:
      - ./scripts/build-runtime-claude.sh

  runtime:codex:check:
    desc: Validate the Codex agent image metadata, lock, and inherited contract.
    cmds:
      - ./scripts/check-runtime-codex.sh

  runtime:codex:build:
    desc: Build and validate the local Codex agent runtime image.
    cmds:
      - ./scripts/build-runtime-codex.sh

  runtime:test:
    desc: Run standard policy and Gateway tests plus the experimental Auth Broker integration tests.
    cmds:
      - ./scripts/check.sh runtime

  pty:evidence:test:
    desc: Verify the parent-owned real-PTY evidence bundle and redaction contract.
    cmds:
      - python3 scripts/test-pty-evidence.py

  site:install:
    desc: Install the exact public-site dependency graph from its lockfile.
    dir: docs/architecture-site
    cmds:
      - npm ci

  site:generate:
    desc: Regenerate Catalog-derived CLI and repository-derived version references.
    dir: docs/architecture-site
    cmds:
      - npm run generate

  site:check:
    desc: Run the complete static, accessibility, interaction, and responsive site gate.
    cmds:
      - ./scripts/check-site.sh full

  site:build:
    desc: Build the deployable GitHub Pages artifact under /tobari/.
    dir: docs/architecture-site
    cmds:
      - npm run build:pages
      - npm run check:dist

  site:dev:
    desc: Serve the public documentation locally at the root path.
    dir: docs/architecture-site
    cmds:
      - npm run dev

  check:fast:
    desc: Run the quick local and agent completion gate.
    cmds:
      - ./scripts/check.sh fast

  check:
    desc: Run the required implementation-quality gate.
    cmds:
      - ./scripts/check.sh full

  security:
    desc: Run dependency, vulnerability, static security, and secret checks.
    cmds:
      - ./scripts/check.sh security

  release:check:
    desc: Validate release scripts, workflow, artifacts, and Formula contracts.
    cmds:
      - ./scripts/check.sh release

  public:check:
    desc: Validate that the repository is safe to publish.
    cmds:
      - ./scripts/check.sh public
